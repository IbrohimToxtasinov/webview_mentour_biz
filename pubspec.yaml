name: mentour_web_view
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  meta: ^1.17.0
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  flutter_svg: ^2.2.3
  get_it: ^9.1.1
  auto_size_text: ^3.0.0
  package_info_plus: ^9.0.0
  shimmer: ^3.0.0
  rename: ^3.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  flutter_spinkit: ^5.2.2
  shared_preferences: ^2.5.4
  lottie: ^3.3.2
  audioplayers: ^6.5.1
  flutter_tts: ^4.1.0
  connectivity_plus: ^6.0.1
  image_picker: ^1.2.1
  flutter_secure_storage: ^10.0.0
  record: ^6.2.0
  path_provider: ^2.1.5
  firebase_core: 3.10.1
  firebase_messaging: 15.2.1
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  youtube_player_iframe: ^5.2.2
  dotted_border: ^3.1.0
  screen_protector: ^1.5.1
  no_screenshot: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/new_icons/
    - assets/icons/
    - assets/images/
    - assets/lotties/
    - assets/translations/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Black.ttf
          weight: 900
        - asset: assets/fonts/nunito/Nunito-BlackItalic.ttf
          weight: 900
          style: italic

        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/nunito/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400

        - asset: assets/fonts/nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/nunito/Nunito-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/nunito/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/nunito/Nunito-ExtraLightItalic.ttf
          weight: 200
          style: italic
flutter_intl:
  enabled: true

