<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Radial Puffy Gradient -->
        <radialGradient id="puffyStar" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFF9C4"/> <!-- Very light yellow center -->
            <stop offset="50%" stop-color="#FDD835"/> <!-- Bright yellow -->
            <stop offset="100%" stop-color="#FBC02D"/> <!-- Darker edge -->
        </radialGradient>

        <!-- Soft Outline -->
        <linearGradient id="softStroke" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFEE58"/>
            <stop offset="100%" stop-color="#F57F17"/>
        </linearGradient>
    </defs>

    <!-- Star Shape -->
    <!-- 'stroke-linejoin="round"' and a thick stroke creates the soft rounded corners -->
    <path d="M50 8
           L62 35 L63 35
           L92 38
           L70 58
           L76 88
           L50 73
           L24 88
           L30 58
           L8 38
           L37 35 L38 35
           Z"
        fill="url(#puffyStar)"
        stroke="url(#softStroke)"
        stroke-width="5"
        stroke-linejoin="round"
        stroke-linecap="round"/>

    <!-- Extra Soft Highlight for 3D feel -->
    <ellipse cx="50" cy="40" rx="15" ry="15" fill="white" opacity="0.25" filter="blur(4px)"/>
</svg>